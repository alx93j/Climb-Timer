<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<link rel="manifest" href="manifest.json">
<title>Climb Interval Timer</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1a1c21;--line:#30333b;--muted:#a4a8b3;--text:#f5f6f8;--accent:#d7ff64;--danger:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:680px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 12px}h1{font-size:1.15rem;letter-spacing:.02em;margin:0} .tag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);padding:5px 8px;border-radius:99px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px}input,select{width:100%;background:#101114;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
button{border:0;border-radius:12px;padding:13px 14px;font:600 .95rem system-ui;cursor:pointer;background:#30333b;color:var(--text)}button.primary{background:var(--accent);color:#15170d}button:disabled{opacity:.45}
.timer{text-align:center;padding:22px 12px}.phase{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}.clock{font-size:clamp(4rem,18vw,7rem);font-weight:750;letter-spacing:-.06em;line-height:1.15;font-variant-numeric:tabular-nums;margin:12px 0}.detail{color:var(--muted);font-size:.9rem;min-height:1.4em}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.controls .primary{grid-column:1/-1}.smallrow{display:flex;gap:8px;flex-wrap:wrap}.smallrow button{flex:1;min-width:100px;font-size:.82rem;padding:10px}
h2{font-size:1rem;margin:0 0 14px}.muted{color:var(--muted);font-size:.85rem;line-height:1.45}.presetrow{display:flex;gap:8px;align-items:center}.presetrow select{flex:1}.presetrow button{padding:11px}.hidden{display:none!important}
.status{font-size:.8rem;color:var(--muted);min-height:1.2em;margin-top:8px;overflow-wrap:anywhere}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.full{grid-column:1/-1}.timer{padding:28px}}
</style>
</head>
<body>
<header><h1>CLIMB / INTERVAL TIMER</h1><span class="tag">OFFLINE READY</span></header>
<section class="panel timer">
 <div class="phase" id="phase">READY</div><div class="clock" id="clock">00:10</div>
 <div class="detail" id="detail">Repeat Hangs · Set 1 of 4</div>
 <div class="controls">
  <button class="primary" id="startBtn">Start session</button>
  <button id="pauseBtn" disabled>Pause</button><button id="resetBtn">Reset</button>
  <button id="skipBtn">Skip phase →</button>
 </div>
</section>
<section class="panel">
 <h2>Workout settings</h2>
 <div class="grid">
  <div class="full"><label for="workoutName">Preset name</label><input id="workoutName" value="Repeat Hangs" maxlength="60"></div>
  <div><label for="hang">Hang (seconds)</label><input id="hang" type="number" min="1" max="3600" value="30"></div>
  <div><label for="rest">Rest between reps (sec)</label><input id="rest" type="number" min="0" max="3600" value="10"></div>
  <div><label for="reps">Reps per set</label><input id="reps" type="number" min="1" max="100" value="2"></div>
  <div><label for="sets">Sets</label><input id="sets" type="number" min="1" max="100" value="4"></div>
  <div><label for="setRest">Rest between sets (sec)</label><input id="setRest" type="number" min="0" max="7200" value="120"></div>
  <div><label for="lead">Get ready (sec)</label><input id="lead" type="number" min="0" max="600" value="10"></div>
 </div>
 <div class="smallrow" style="margin-top:14px"><button id="applyBtn" class="primary">Apply settings</button><button id="saveBtn">Save as preset</button></div>
 <p class="muted">A short beep sounds on each countdown second from the final 3 seconds of every phase, including Get Ready. A different longer beep marks the phase transition.</p>
</section>
<section class="panel">
 <h2>Saved presets</h2>
 <div class="presetrow"><select id="presetSelect" aria-label="Saved presets"></select><button id="loadBtn">Load</button></div>
 <div class="smallrow" style="margin-top:10px"><button id="shareBtn">Share selected</button><button id="importBtn">Import code</button><button id="exportBtn">Export all</button></div>
 <div id="status" class="status" role="status"></div>
 <textarea id="shareText" class="hidden" rows="4" style="width:100%;margin-top:10px;background:#101114;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px" placeholder="Shared preset code or JSON"></textarea>
</section>
<script>
const DEFAULT_CODE = "CLIMB1-eyJpZCI6InAtMTc5MjU3NzY5Mjc1OSIsIm5hbWUiOiJSZXBlYXQgSGFuZ3MiLCJoYW5nIjozMCwicmVzdCI6MTAsInJlcHMiOjIsInNldHMiOjQsInNldFJlc3QiOjEyMCwibGVhZCI6MTAsImN1ZSI6Im5vcm1hbCJ9";
const $ = id => document.getElementById(id);
const fields = ["workoutName","hang","rest","reps","sets","setRest","lead"];
let audioCtx=null, tickHandle=null, running=false, paused=false, endAt=0, remaining=0, phase="READY", rep=1, setNo=1, currentDuration=10;
function decodeCode(code){const payload=code.trim().replace(/^CLIMB1-/,"");return JSON.parse(decodeURIComponent(escape(atob(payload))))}
function encodeCode(p){return "CLIMB1-"+btoa(unescape(encodeURIComponent(JSON.stringify(p))))}
function readForm(){return {id:"p-"+Date.now(),name:$("workoutName").value.trim()||"My workout",hang:num("hang",30,1,3600),rest:num("rest",10,0,3600),reps:num("reps",2,1,100),sets:num("sets",4,1,100),setRest:num("setRest",120,0,7200),lead:num("lead",10,0,600),cue:"normal"}}
function num(id,def,min,max){const n=parseInt($(id).value,10);return Math.min(max,Math.max(min,Number.isFinite(n)?n:def))}
function fillForm(p){$("workoutName").value=p.name||"Workout";["hang","rest","reps","sets","setRest","lead"].forEach(k=>$(k).value=p[k]??0)}
function getPresets(){try{return JSON.parse(localStorage.getItem("climbPresets")||"[]")}catch{return []}}
function setPresets(a){localStorage.setItem("climbPresets",JSON.stringify(a));renderPresets()}
function renderPresets(){const a=getPresets();$("presetSelect").innerHTML="";a.forEach((p,i)=>{const o=document.createElement("option");o.value=p.id;o.textContent=p.name||"Workout";$("presetSelect").appendChild(o)});if(!a.length){const o=document.createElement("option");o.textContent="No saved presets";$("presetSelect").appendChild(o)}}
function selectedPreset(){return getPresets().find(p=>p.id===$("presetSelect").value)}
function applySettings(){stopTimer();const p=readForm();rep=1;setNo=1;phase="READY";remaining=p.lead;currentDuration=remaining;updateDisplay();$("status").textContent="Settings applied."}
function getCurrent(){return readForm()}
function updateDisplay(){const sec=Math.max(0,Math.ceil(remaining));$("clock").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");$("phase").textContent=phase==="READY"?"GET READY":phase==="HANG"?"HANG":phase==="REST"?"REST BETWEEN REPS":phase==="SETREST"?"REST BETWEEN SETS":"COMPLETE";const p=getCurrent();$("detail").textContent=phase==="READY"?"Prepare to start · "+p.name:phase==="COMPLETE"?"Workout complete":`Rep ${Math.min(rep,p.reps)} of ${p.reps} · Set ${Math.min(setNo,p.sets)} of ${p.sets} · ${p.name}`;$("startBtn").textContent=running?(paused?"Resume":"Running"):"Start session";$("pauseBtn").disabled=!running||phase==="COMPLETE";$("startBtn").disabled=running&&!paused}
function beep(freq=880,duration=.08,volume=.055){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="sine";osc.frequency.value=freq;gain.gain.setValueAtTime(volume,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration)}catch(e){}}
function startTimer(){if(running&&paused){paused=false;endAt=Date.now()+remaining*1000;tickHandle=setInterval(tick,100);updateDisplay();return}if(running)return;applyValuesNoStop();running=true;paused=false;phase="READY";remaining=getCurrent().lead;currentDuration=remaining;rep=1;setNo=1;endAt=Date.now()+remaining*1000;beep(660,.12);tickHandle=setInterval(tick,100);updateDisplay();if(remaining===0)advancePhase()}
function applyValuesNoStop(){const p=readForm();if(!p.name)p.name="Workout"}
function tick(){if(!running||paused)return;const next=Math.max(0,(endAt-Date.now())/1000);const prev=Math.ceil(remaining);remaining=next;const now=Math.ceil(remaining);if(now!==prev&&now<=3&&now>=1)beep(880,.055,.045);updateDisplay();if(remaining<=0){beep(1040,.18,.07);advancePhase()}}
function nextPhase(name,duration){phase=name;remaining=duration;currentDuration=duration;endAt=Date.now()+duration*1000;if(duration===0){advancePhase();return}updateDisplay()}
function advancePhase(){const p=getCurrent();if(phase==="READY"){nextPhase("HANG",p.hang);return}if(phase==="HANG"){if(rep<p.reps){nextPhase("REST",p.rest);return}if(setNo<p.sets){nextPhase("SETREST",p.setRest);return}finish();return}if(phase==="REST"){rep++;nextPhase("HANG",p.hang);return}if(phase==="SETREST"){setNo++;rep=1;nextPhase("HANG",p.hang);return}}
function finish(){running=false;paused=false;clearInterval(tickHandle);tickHandle=null;phase="COMPLETE";remaining=0;beep(1320,.35,.08);updateDisplay();$("startBtn").disabled=false;$("pauseBtn").disabled=true;$("startBtn").textContent="Start again"}
function stopTimer(){running=false;paused=false;clearInterval(tickHandle);tickHandle=null}
function resetTimer(){stopTimer();const p=getCurrent();rep=1;setNo=1;phase="READY";remaining=p.lead;currentDuration=remaining;updateDisplay();$("startBtn").disabled=false}
$("startBtn").addEventListener("click",()=>{if(running&&paused){startTimer()}else startTimer()});
$("pauseBtn").addEventListener("click",()=>{if(!running)return;if(!paused){remaining=Math.max(0,(endAt-Date.now())/1000);paused=true;clearInterval(tickHandle);tickHandle=null;updateDisplay();$("startBtn").disabled=false;$("startBtn").textContent="Resume"}});
$("resetBtn").addEventListener("click",resetTimer);
$("skipBtn").addEventListener("click",()=>{if(!running){advancePhase();return}beep(1040,.12);advancePhase()});
$("applyBtn").addEventListener("click",applySettings);
$("saveBtn").addEventListener("click",()=>{const p=readForm(),a=getPresets();a.push(p);setPresets(a);$("presetSelect").value=p.id;$("status").textContent="Preset saved on this device."});
$("loadBtn").addEventListener("click",()=>{const p=selectedPreset();if(p){fillForm(p);applySettings();$("status").textContent="Loaded "+p.name}});
$("shareBtn").addEventListener("click",()=>{const p=selectedPreset()||readForm();$("shareText").classList.remove("hidden");$("shareText").value=encodeCode(p);$("shareText").focus();$("shareText").select();$("status").textContent="Share code ready. Copy it and send it to another user."});
$("importBtn").addEventListener("click",()=>{const area=$("shareText");area.classList.remove("hidden");if(!area.value.trim()){area.focus();$("status").textContent="Paste a CLIMB1 code or exported JSON here, then tap Import code again.";return}try{let p;const s=area.value.trim();if(s.startsWith("CLIMB1-"))p=decodeCode(s);else {const parsed=JSON.parse(s);p=Array.isArray(parsed)?null:parsed}if(!p||!p.name)throw Error("Invalid preset");p.id="p-"+Date.now();const a=getPresets();a.push(p);setPresets(a);$("presetSelect").value=p.id;fillForm(p);$("status").textContent="Imported "+p.name;area.value=""}catch(e){$("status").textContent="Could not import. Check the code or JSON and try again."}});
$("exportBtn").addEventListener("click",()=>{const area=$("shareText");area.classList.remove("hidden");area.value=JSON.stringify(getPresets(),null,2);area.focus();area.select();$("status").textContent="All saved presets shown as JSON. Copy to back up or share."});
try{const decoded=decodeCode(DEFAULT_CODE);const presets=getPresets();if(!presets.some(p=>p.id===decoded.id)){presets.unshift(decoded);setPresets(presets)}else renderPresets();$("presetSelect").value=decoded.id;fillForm(decoded)}catch(e){renderPresets()}
phase="READY";remaining=num("lead",10,0,600);updateDisplay();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body></html>
